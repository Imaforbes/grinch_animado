<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Rock+Salt" rel="stylesheet">
    <link rel="stylesheet" href="grinch.css">
    <title>El Grinch // CSS Animation + Hallmark Portfolio Frame</title>
</head>
<body>
    <!-- FASE 5: Marco Editorial de Portafolio (Hallmark Craft Frame) -->
    <header class="hallmark-header">
        <div class="hallmark-bar">
            <span class="badge badge-dark">PROJECT: GRINCH CSS ART</span>
            <span class="badge badge-blue">ENGINE: PURE CSS3 KEYFRAMES</span>
            <span class="badge badge-green">DEV: IMANOL FORBES</span>
            <a href="https://github.com/Imaforbes/grinch_animado" target="_blank" rel="noopener noreferrer" class="badge badge-yellow badge-link">
                GITHUB REPO ↗
            </a>
        </div>
    </header>

    <!-- FASE 3: Contenedor de nieve invernal en el fondo -->
    <div id="snow-container" class="snow-container"></div>

    <div class="character" id="grinch-card">
        <!-- FASE 2: Globo de Diálogo Interactivo con Frases Célebres del Grinch -->
        <div id="speech-bubble" class="speech-bubble" title="Haz clic en el Grinch para decir más frases">
            "¡4:00 PM? Revolcarme en mi propia miseria!"
        </div>

        <div class="christmas-hat">
            <div class="red-part turn-to"></div>
            <div class="white-part turn-to"></div>
            <div class="white-ball"></div>
        </div>
        
        <div class="grinch turn-to">
            <div class="eye turn-to">
                <div class="pupil turn-to"></div>
            </div>
            <div class="eye turn-to">
                <div class="pupil turn-to"></div>
            </div>
            <div class="nose turn-to"></div>
            
            <!-- FASE 1: El Corazón del Grinch (hacer clic para crecer 3 tallas) -->
            <div class="heart size-1" id="grinch-heart" title="¡Haz clic para hacer crecer el corazón del Grinch!"></div>
        </div>
        
        <h2 class="name">El Grinch</h2>
        
        <!-- Controles Interactivos Estilo Hallmark / Industrial Editorial -->
        <div class="heart-controls">
            <div class="controls-row">
                <button id="heart-btn" class="heart-button" title="Haz clic para aumentar 1 talla el corazón">
                    ❤️ CORAZÓN [1x]
                </button>
                <button id="quote-btn" class="quote-button" title="Haz clic para escuchar otra frase icónica">
                    💬 FRASE CÉLEBRE
                </button>
                <button id="snow-btn" class="snow-button" title="Activar o desactivar efecto de nieve en el fondo">
                    ❄️ NIEVE [ON]
                </button>
            </div>
            <div class="heart-status" id="heart-status">
                STATE: <span>GRINCH MALHUMORADO (1x)</span>
            </div>
        </div>
    </div>

    <!-- Script de interactividad (Vanilla JS) -->
    <script>
        /* ====================================================================
           FASE 1: LÓGICA DEL CORAZÓN DEL GRINCH (3 TALLAS)
           ==================================================================== */
        const heart = document.getElementById('grinch-heart');
        const btn = document.getElementById('heart-btn');
        const statusSpan = document.querySelector('#heart-status span');

        let currentSize = 1;

        function updateHeart(size) {
            currentSize = size;
            heart.className = `heart size-${size}`;
            
            if (size === 1) {
                btn.innerHTML = '❤️ CORAZÓN [1x]';
                statusSpan.style.color = '#FF4742';
                statusSpan.textContent = 'GRINCH MALHUMORADO (1x)';
            } else if (size === 2) {
                btn.innerHTML = '❤️ CORAZÓN [2x]';
                statusSpan.style.color = '#00F0FF';
                statusSpan.textContent = 'SINTIENDO... SENTIMIENTOS (2x)';
            } else if (size === 3) {
                btn.innerHTML = '🔄 ¡CRECIÓ 3 TALLAS!';
                statusSpan.style.color = '#00F090';
                statusSpan.textContent = '¡ESPÍRITU NAVIDEÑO AL 100%! 🎄✨';
            }
        }

        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const nextSize = currentSize >= 3 ? 1 : currentSize + 1;
            updateHeart(nextSize);
        });

        heart.addEventListener('click', (e) => {
            e.stopPropagation();
            const nextSize = currentSize >= 3 ? 1 : currentSize + 1;
            updateHeart(nextSize);
        });

        /* ====================================================================
           FASE 2: GLOBO DE DIÁLOGO CON FRASES CÉLEBRES DEL GRINCH
           ==================================================================== */
        const speechBubble = document.getElementById('speech-bubble');
        const quoteBtn = document.getElementById('quote-btn');
        const grinchCard = document.getElementById('grinch-card');

        const GRINCH_QUOTES = [
            "\"¡4:00 PM? Revolcarme en mi propia miseria!\"",
            "\"6:30 PM: Cenar conmigo mismo... ¡esa no la cancelo!\"",
            "\"¡Ay no, estoy sintiendo... sentimientos!\"",
            "\"¡Odio la Navidad! ¡La odio, la odio, la odio!\"",
            "\"7:00 PM: Luchar con el odio que me tengo... estoy ocupado.\"",
            "\"¿Qué es ese olor? ¡Ah, soy yo!\"",
            "\"Tal vez la Navidad no viene de una tienda...\""
        ];

        let quoteIndex = 0;

        function nextQuote() {
            quoteIndex = (quoteIndex + 1) % GRINCH_QUOTES.length;
            speechBubble.style.animation = 'none';
            speechBubble.offsetHeight;
            speechBubble.textContent = GRINCH_QUOTES[quoteIndex];
            speechBubble.style.animation = 'popBubble 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        }

        quoteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            nextQuote();
        });

        speechBubble.addEventListener('click', (e) => {
            e.stopPropagation();
            nextQuote();
        });

        grinchCard.addEventListener('click', () => {
            nextQuote();
        });

        /* ====================================================================
           FASE 3: GENERADOR DE NIEVE INVERNAL CON KEYFRAMES CSS3
           ==================================================================== */
        const snowContainer = document.getElementById('snow-container');
        const snowBtn = document.getElementById('snow-btn');
        const SNOWFLAKE_COUNT = 30;
        let snowEnabled = true;

        function createSnowflakes() {
            for (let i = 0; i < SNOWFLAKE_COUNT; i++) {
                const flake = document.createElement('div');
                flake.className = 'snowflake';
                flake.innerHTML = '❄';
                
                const leftPos = Math.random() * 100;
                const duration = 6 + Math.random() * 8;
                const delay = Math.random() * 6;
                const size = 10 + Math.random() * 14;
                const opacity = 0.3 + Math.random() * 0.6;

                flake.style.left = `${leftPos}%`;
                flake.style.animationDuration = `${duration}s, ${duration * 0.6}s`;
                flake.style.animationDelay = `${delay}s, ${delay * 0.5}s`;
                flake.style.fontSize = `${size}px`;
                flake.style.opacity = opacity;

                snowContainer.appendChild(flake);
            }
        }

        snowBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            snowEnabled = !snowEnabled;
            snowContainer.style.opacity = snowEnabled ? '1' : '0';
            snowBtn.innerHTML = snowEnabled ? '❄️ NIEVE [ON]' : '❄️ NIEVE [OFF]';
            snowBtn.style.borderColor = snowEnabled ? '#00F0FF' : '#FF4742';
            snowBtn.style.color = snowEnabled ? '#00F0FF' : '#FF4742';
        });

        createSnowflakes();
    </script>
</body>
</html>
